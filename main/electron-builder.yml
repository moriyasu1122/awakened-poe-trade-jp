publish:
  - "github"
productName: "Awakened PoE Trade"
npmRebuild: false
toolsets:
  appimage: 1.0.3
artifactBuildCompleted: "build/apprun-patch.test.mjs"
files:
  - "package.json"
  - from: "dist"
    to: "."
    filter: ["main.js", "vision.js"]
  - from: "../renderer/dist"
    to: "."
extraMetadata:
  main: "main.js"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 日本語版: 本家と同じ名前の末尾に -jp を付ける
  artifactName: "${productName} Setup ${version}-jp.${ext}"
portable:
  artifactName: "${productName} ${version}-jp.${ext}"
win:
  target:
  - "nsis"
  - "portable"
linux:
  target:
  - "AppImage"
mac:
  target:
  - target: "dmg"
    arch:
    - "universal"
  identity: null
  x64ArchFiles: "*"
